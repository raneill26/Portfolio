<section class="projects-hero shell" appReveal>
  <h1>My Projects</h1>
</section>

<section class="projects-list shell">
  @for (project of projects; track project.title; let i = $index) {
    <app-project-card
      [project]="project"
      appReveal
      [revealDelay]="i * 90"
    ></app-project-card>
  }
</section>
