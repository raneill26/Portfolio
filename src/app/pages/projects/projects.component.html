<section class="projects-hero shell" appReveal>
  <span class="eyebrow">Projects</span>
  <h1>Things I've built.</h1>
  <p class="lede">
    Compensation systems pay the bills. These are the projects I build because the problem was
    interesting — from a bare-metal game running on an FPGA to a native iOS app currently in
    development.
  </p>
</section>

<section class="projects-list shell">
  @for (project of projects; track project.title; let i = $index) {
    <app-project-card
      [project]="project"
      appReveal
      [revealDelay]="i * 90"
    ></app-project-card>
  }
</section>
