<header class="nav-wrap" [class.scrolled]="scrolled()">
  <nav class="navbar glass" aria-label="Primary">
    <a class="brand" routerLink="/home" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">RN</span>
      <span class="brand-text">Ryan Neill</span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <button
      class="menu-toggle"
      type="button"
      [class.open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
      aria-controls="nav-links"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
    </button>
  </nav>
</header>

@if (menuOpen()) {
  <div class="nav-scrim" (click)="closeMenu()"></div>
}
